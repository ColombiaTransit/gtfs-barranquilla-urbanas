<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIU-haltes Barranquilla | OpenStreetMap</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui,Arial,sans-serif;color:#1c2938}header{padding:12px 16px;background:#142b42;color:white;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:18px;margin:0}header small{opacity:.8}#map{height:calc(100dvh - 110px);min-height:400px}#bar{display:flex;gap:10px;padding:10px 14px;align-items:center;flex-wrap:wrap;background:#f5f7fa}input,select{padding:8px;border:1px solid #bdc7d2;border-radius:6px;font:inherit}input{flex:1;min-width:180px}#status{color:#46586c;font-size:12px}button{padding:8px 12px;border:1px solid #bdc7d2;border-radius:6px;background:white;cursor:pointer}.stop-dot{width:12px;height:12px;border:2px solid white;border-radius:50%;background:#177ac2;box-shadow:0 1px 4px #2228}.legend{background:white;padding:8px;border-radius:6px;box-shadow:0 1px 8px #0002;font-size:12px}.popup-label{font-weight:700;font-size:14px;margin-bottom:6px}.popup-row{margin:4px 0}a{color:#1764a2}</style></head>
<body><header><h1>SIU-haltes · Barranquilla</h1><small>OpenStreetMap · Bron: ColombiaTransit / SIU GTFS-staging</small></header>
<div id="bar"><input id="search" type="search" placeholder="Zoek op haltenaam of ID…" aria-label="Zoek haltes"><select id="direction" aria-label="Filter rijrichting"><option value="">Alle richtingen</option><option>NS</option><option>SN</option><option>EO</option><option>OE</option><option value="NONE">Zonder richtingscode</option></select><button id="reset">Reset</button><span id="status">Haltes laden…</span></div><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
'use strict';
const URL='https://raw.githubusercontent.com/ColombiaTransit/gtfs-barranquilla-urbanas/main/sources/siu/gtfs_staging/stops_draft_NOT_FOR_PUBLICATION.txt';
const map=L.map('map',{preferCanvas:true}).setView([10.975,-74.815],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
const cluster=L.markerClusterGroup({chunkedLoading:true,chunkInterval:100,chunkDelay:25,showCoverageOnHover:false,maxClusterRadius:55});map.addLayer(cluster);
const search=document.querySelector('#search'),direction=document.querySelector('#direction'),status=document.querySelector('#status');let stops=[];
function csvParse(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean),headers=lines.shift().split(',');return lines.map(line=>{const cells=[];let s='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){s+='"';i++}else q=!q}else if(c===','&&!q){cells.push(s);s=''}else s+=c}cells.push(s);return Object.fromEntries(headers.map((h,i)=>[h,cells[i]||'']))})}
function code(name){const matches=[...name.matchAll(/(?:^|[\s\-(])(?:NS|SN|EO|OE)(?=\s|\)|-|$)/gi)];return matches.length?matches[matches.length-1][0].match(/NS|SN|EO|OE/i)[0].toUpperCase():''}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const dot=L.divIcon({className:'',html:'<div class="stop-dot"></div>',iconSize:[12,12],iconAnchor:[6,6]});
function nearby(s){return stops.filter(x=>x.stop_id!==s.stop_id).map(x=>({...x,d:map.distance([s.lat,s.lon],[x.lat,x.lon])})).sort((a,b)=>a.d-b.d).slice(0,5)}
function nearbyHtml(s){const n=nearby(s);return '<div class="popup-row"><b>Dichtstbijzijnde andere SIU-haltes:</b></div><ol style="padding-left:20px;margin:5px 0">'+n.map(x=>'<li><a href="#" class="nearby-stop" data-stop="'+escapeHtml(x.stop_id)+'">'+escapeHtml(x.stop_name)+'</a> ('+Math.round(x.d)+' m; '+(x.dir||'geen code')+')</li>').join('')+'</ol>'}
function draw(){const term=search.value.trim().toLocaleLowerCase(),dir=direction.value;cluster.clearLayers();const visible=stops.filter(s=>(!term||s.stop_name.toLocaleLowerCase().includes(term)||s.stop_id.toLowerCase().includes(term))&&(!dir||(dir==='NONE'?!s.dir:s.dir===dir)));const markers=visible.map(s=>{let m=L.marker([s.lat,s.lon],{icon:dot,title:s.stop_name});m.bindPopup(`<div class="popup-label">${escapeHtml(s.stop_name)}</div><div class="popup-row"><b>Richting:</b> ${s.dir||'Niet vermeld'}</div><div class="popup-row"><b>GPS:</b> ${s.lat}, ${s.lon}</div><div class="popup-row"><b>SIU ID:</b> <code>${escapeHtml(s.stop_id)}</code></div><a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${s.lat},${s.lon}">Open in Google Maps</a>${nearbyHtml(s)}`);return m});cluster.addLayers(markers);status.textContent=String(visible.length)+' van '+String(stops.length)+' haltes';if(term&&visible.length&&visible.length<=50){map.fitBounds(L.latLngBounds(visible.map(s=>[s.lat,s.lon])).pad(.2),{maxZoom:16})}}
map.on('popupopen',event=>{const popup=event.popup.getElement();if(!popup)return;popup.querySelectorAll('.nearby-stop').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const target=stops.find(s=>s.stop_id===a.dataset.stop);if(!target)return;search.value=target.stop_id;direction.value='';draw();map.setView([target.lat,target.lon],18);setTimeout(()=>{cluster.eachLayer(m=>{if(m.options.title===target.stop_name&&m.getLatLng().distanceTo([target.lat,target.lon])<1){cluster.zoomToShowLayer(m,()=>m.openPopup())}})},100)}))});
let debounce;search.addEventListener('input',()=>{clearTimeout(debounce);debounce=setTimeout(draw,220)});direction.addEventListener('change',draw);document.querySelector('#reset').addEventListener('click',()=>{search.value='';direction.value='';draw();map.setView([10.975,-74.815],11)});
fetch(URL,{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.text()}).then(csv=>{stops=csvParse(csv).map(s=>({...s,lat:Number(s.stop_lat),lon:Number(s.stop_lon),dir:code(s.stop_name)})).filter(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lon)&&s.lat>=-90&&s.lat<=90&&s.lon>=-180&&s.lon<=180);draw();if(stops.length)map.fitBounds(L.latLngBounds(stops.map(s=>[s.lat,s.lon])).pad(.03))}).catch(err=>{status.textContent='Kon SIU-haltes niet laden: '+err.message;document.querySelector('#bar').insertAdjacentHTML('beforeend','<small>Internetverbinding en toegang tot GitHub zijn vereist. Controleer de repository of open de HTML via een lokale webserver.</small>')});
</script></body></html>
