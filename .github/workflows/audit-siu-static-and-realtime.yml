name: Audit SIU static source and probe GTFS-RT potential
'on':
  push:
    paths:
      - '.github/workflows/audit-siu-static-and-realtime.yml'
  workflow_dispatch:
    inputs:
      samples:
        description: "Number of anonymous snapshots (1-8)"
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3", "5", "8"]
      interval_seconds:
        description: "Seconds between snapshots (0-300)"
        required: true
        default: "60"
        type: choice
        options: ["0", "30", "60", "120", "300"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Audit public SIU GraphQL source
        run: python scripts/audit_siu_static_and_realtime.py --samples "${{ inputs.samples || '3' }}" --interval-seconds "${{ inputs.interval_seconds || '60' }}"
      - name: Publish report
        if: always()
        run: |
          if [ -f build/siu-source-audit/report.md ]; then
            cat build/siu-source-audit/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siu-source-audit
          path: build/siu-source-audit/
          if-no-files-found: warn
          retention-days: 7
