name: Check full AMB bus route geometry and SIU stop order with GraphHopper
on:
  workflow_dispatch:
    inputs:
      max_patterns:
        description: Number of provisional route patterns to check (1-70)
        required: false
        default: '70'
  push:
    paths:
      - scripts/audit_amb_full_route_graphhopper_bus_geometry.py
      - .github/workflows/audit-amb-full-GH-bus-geometry.yml
permissions:
  contents: write
concurrency:
  group: amb-full-GH-bus-geometry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  geometry-and-stop-order:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS and GraphHopper client requirements
        run: python -m pip install --disable-pip-version-check "shapely>=2.0,<3" "pyproj>=3.5,<4" requests
      - name: Validate code compiles
        run: python -m py_compile scripts/audit_amb_full_route_graphhopper_bus_geometry.py
      - name: Load historical ArcGIS solely for missing or mislabeled KMZ sources
        run: python scripts/harvest_amb_arcgis_route_shapes.py build/amb-arcgis-fallback
      - name: Check each KMZ route section with one-way aware GraphHopper bus routing
        env:
          GRAPHHOPPER_URL: ${{ vars.GRAPHHOPPER_URL }}
          MAX_PATTERNS: ${{ github.event.inputs.max_patterns || '70' }}
        run: |
          if [ -z "$GRAPHHOPPER_URL" ]; then
            echo "::error::ColombiaTransit GRAPHHOPPER_URL organization variable not accessible"
            exit 1
          fi
          echo "::add-mask::$GRAPHHOPPER_URL"
          python scripts/audit_amb_full_route_graphhopper_bus_geometry.py \
            --max-patterns "$MAX_PATTERNS" --segment-km 9 --anchor-spacing-m 950
      - name: Print non-private research summary
        if: always()
        run: |
          if [ -f build/amb-graphhopper-full-route-geometry-QA/summary.md ]; then
            cat build/amb-graphhopper-full-route-geometry-QA/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit research-only road shapes and source stop access QA
        if: github.ref == 'refs/heads/main'
        run: |
          if [ ! -f build/amb-graphhopper-full-route-geometry-QA/summary.json ]; then
            echo "No full-route research data to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p sources/amb/full_GH_bus_geometry_quality/
            cp -a build/amb-graphhopper-full-route-geometry-QA/. sources/amb/full_GH_bus_geometry_quality/
            git add sources/amb/full_GH_bus_geometry_quality/
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "data: audit complete AMB KMZ bus roads and 9020 SIU stop visits (no times)"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
      - name: Archive full route quality review and GH bus road candidate geometries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMB-70-patterns-GH-bus-road-and-stop-order-QA
          path: build/amb-graphhopper-full-route-geometry-QA/
          if-no-files-found: warn
          retention-days: 7
