name: Stage SIU route crosswalk and GTFS stop candidates
on:
  push:
    paths:
      - scripts/build_siu_gtfs_stop_staging.py
      - sources/siu/stop_name_spelling_corrections_2026-11-03.csv
      - tests/test_siu_stop_name_normalization.py
      - .github/workflows/stage-siu-gtfs-stops.yml
      - sources/siu/public_extract/siu_itineraries.csv
      - sources/siu/public_extract/siu_route_stop_sequences.csv
      - sources/siu/analysis/siu_to_amb_routecode_candidates.csv
      - gtfs/routes.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed spellings and direction safety
        run: python -m unittest discover -s tests -p 'test_siu_stop_name_normalization.py' -v
      - name: Build conservative candidate stop IDs and route links
        run: python scripts/build_siu_gtfs_stop_staging.py --out build/siu-gtfs-staging
      - name: Publish staging report
        if: always()
        run: |
          if [ -f build/siu-gtfs-staging/summary.md ]; then
            cat build/siu-gtfs-staging/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit staged research outputs (not gtfs/stops.txt)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p sources/siu/gtfs_staging
          cp build/siu-gtfs-staging/* sources/siu/gtfs_staging/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/siu/gtfs_staging/
          if ! git diff --cached --quiet; then
            git commit -m "data(siu): update conservative GTFS stop-ID staging and route crosswalk"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve reproducible staged research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siu-gtfs-stop-and-crosswalk-staging
          path: build/siu-gtfs-staging/
          if-no-files-found: warn
          retention-days: 45
