name: Audit AMB legal GTFS status
on:
  workflow_dispatch:
  push:
    paths:
      - 'sources/amb/legal_validity_ocr_review/gtfs_legal_status_2026-11-04.csv'
      - 'scripts/audit_amb_legal_status.py'
      - '.github/workflows/audit-amb-legal-status.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_amb_legal_status.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: amb-legal-status-audit
          path: sources/amb/legal_validity_ocr_review/gtfs_legal_status_audit.json
