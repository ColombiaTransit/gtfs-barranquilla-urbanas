name: Audit COOLITORAL A4 official street itinerary against OSM
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Match official street names to six AMBQ segments (read only)
        env:
          API_OVERPASS: ${{ vars.API_OVERPASS }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$API_OVERPASS" ]; then
            echo "::error::Organization variable API_OVERPASS is missing"
            exit 1
          fi
          echo "::add-mask::$API_OVERPASS"
          python scripts/audit_a4_official_recorrido_osm.py
      - name: Publish QA summary
        if: always()
        run: |
          if [ -f build/a4-recorrido/report.md ]; then
            cat build/a4-recorrido/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: A4-4109-OSM-recorrido-candidate-QA
          path: build/a4-recorrido/
          if-no-files-found: warn
