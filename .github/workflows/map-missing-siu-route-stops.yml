name: Map missing SIU route stops to KMZ and ArcGIS trip patterns
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/map_missing_siu_route_stops_to_trips.py
      - scripts/audit_mapped_trip_pattern_readiness.py
      - scripts/audit_missing_route_stop_gaps_and_shapes.py
      - .github/workflows/map-missing-siu-route-stops.yml
concurrency:
  group: amb-map-missing-siu-stops-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  map-stop-patterns:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spatial matching and source retrieval dependencies
        run: python -m pip install --disable-pip-version-check "shapely>=2.0,<3" "pyproj>=3.5,<4" requests
      - name: Validate mapping script compiles
        run: python -m py_compile scripts/map_missing_siu_route_stops_to_trips.py scripts/audit_mapped_trip_pattern_readiness.py scripts/audit_missing_route_stop_gaps_and_shapes.py
      - name: Retrieve older ArcGIS route shapes solely for wrongly labeled KMZ fallback
        run: |
          python scripts/harvest_amb_arcgis_route_shapes.py build/amb-arcgis-fallback
      - name: Map already known physical SIU stop IDs to 60 missing KMZ route variants
        run: |
          python scripts/map_missing_siu_route_stops_to_trips.py \
            --arcgis-geojson build/amb-arcgis-fallback/arcgis_routes_original.geojson \
            --output build/amb-missing-route-stop-trip-patterns
      - name: Audit source geometry fragmentation and prepare GraphHopper input without times
        run: python scripts/audit_mapped_trip_pattern_readiness.py
      - name: Inspect stop gaps over 2km and disconnected route shape components
        run: python scripts/audit_missing_route_stop_gaps_and_shapes.py
      - name: Display candidate coverage and limitations
        if: always()
        run: |
          if [ -f build/amb-missing-route-stop-trip-patterns/summary.md ]; then
            cat build/amb-missing-route-stop-trip-patterns/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/amb-missing-route-stop-trip-patterns/route_readiness_summary.md ]; then
            cat build/amb-missing-route-stop-trip-patterns/route_readiness_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f build/amb-missing-route-stop-trip-patterns/gap_and_geometry_audit_summary.md ]; then
            cat build/amb-missing-route-stop-trip-patterns/gap_and_geometry_audit_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit research patterns only (do not modify gtfs/)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p sources/amb/missing_siu_trip_stop_patterns
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Concurrent data workflows may update main while this run is working.
          # Always regenerate the commit from the latest main; never rebase a
          # generated-data commit with overlapping paths.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp -a build/amb-missing-route-stop-trip-patterns/. sources/amb/missing_siu_trip_stop_patterns/
            git add sources/amb/missing_siu_trip_stop_patterns/
            if git diff --cached --quiet; then
              echo "Research output unchanged."
              exit 0
            fi
            git commit -m "data: map existing SIU stop IDs along missing AMB route patterns without times"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update, retrying commit attempt $attempt"
            sleep 3
          done
          exit 1
      - name: Archive route patterns and all stop selection decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missing-siu-trip-patterns-with-physical-stop-order-no-times
          path: build/amb-missing-route-stop-trip-patterns/
          if-no-files-found: warn
          retention-days: 45
