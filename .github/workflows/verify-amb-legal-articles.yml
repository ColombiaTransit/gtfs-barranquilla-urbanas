name: Verify AMB PDF identity and stage legal article evidence
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/verify_amb_ocr_article_candidates.py
      - .github/workflows/verify-amb-legal-articles.yml
permissions:
  contents: write
concurrency:
  group: amb-legal-article-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  legal-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Spanish OCR and PDF utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-spa
      - name: Reproduce nine PDF extractions and stage article candidates
        run: |
          python -m py_compile scripts/collect_amb_nine_resolution_ocr.py scripts/verify_amb_ocr_article_candidates.py
          python scripts/collect_amb_nine_resolution_ocr.py
          python scripts/verify_amb_ocr_article_candidates.py
      - name: Show verification summary
        if: always()
        run: |
          if [ -f build/amb-legal-article-verification/summary.md ]; then
            cat build/amb-legal-article-verification/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit evidence indexes without legal approval
        if: github.ref == 'refs/heads/main'
        run: |
          test -s build/amb-legal-article-verification/summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p sources/amb/legal_validity_ocr_review/article_verification
            cp build/amb-legal-article-verification/*csv sources/amb/legal_validity_ocr_review/article_verification/
            cp build/amb-legal-article-verification/summary.json sources/amb/legal_validity_ocr_review/article_verification/
            cp build/amb-legal-article-verification/summary.md sources/amb/legal_validity_ocr_review/article_verification/
            git add sources/amb/legal_validity_ocr_review/article_verification/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: stage AMB source hashes and page-linked legal article OCR candidates"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Upload original PDFs and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMB-legal-article-verification-PENDING-VISUAL-REVIEW
          path: |
            build/amb-legal-article-verification/
            build/amb-nine-resolution-ocr/
          retention-days: 7
          if-no-files-found: warn
