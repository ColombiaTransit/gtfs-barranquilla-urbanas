name: Extract AMB PDFs (native text + OCR)
on:
  workflow_dispatch:
    inputs:
      agency:
        description: "Optional exact agency name (empty = all)"
        required: false
        type: string
      resolution:
        description: "Optional exact resolution (empty = all)"
        required: false
        type: string
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF and Spanish OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-spa
      - name: Extract registered PDFs
        env:
          AGENCY: ${{ inputs.agency }}
          RESOLUTION: ${{ inputs.resolution }}
        run: |
          python3 scripts/extract_amb_pdfs.py --agency "$AGENCY" --resolution "$RESOLUTION"
      - name: Upload extraction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amb-pdf-extractions
          path: ocr-output/
          if-no-files-found: warn
          retention-days: 7
