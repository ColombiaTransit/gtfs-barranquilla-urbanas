name: Audit AMB KMZ routes missing SIU stop patterns
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/audit_amb_kmz_stop_coverage.py
      - .github/workflows/audit-amb-kmz-stop-coverage.yml
      - sources/amb/kmz/manifest.csv
      - sources/siu/gtfs_staging/siu_amb_route_crosswalk_review.csv
      - sources/siu/open_route_review/provisional_base_route_code_candidates.csv
      - sources/osm/analysis/possible_boarding_platforms.csv
permissions:
  contents: write
jobs:
  kmz-stop-gap-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spatial research dependencies
        run: python -m pip install --disable-pip-version-check shapely>=2.0,<3 pyproj>=3.5,<4
      - name: Cross-check official KMZ against SIU route/stop linkage and locate candidate points
        run: python scripts/audit_amb_kmz_stop_coverage.py
      - name: Show inventory and caution in Actions summary
        if: always()
        run: |
          if [ -f build/amb-kmz-stop-gaps/summary.md ]; then cat build/amb-kmz-stop-gaps/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Save the source audit and unconfirmed stop proximity only
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p sources/amb/kmz_stop_gaps
          cp -a build/amb-kmz-stop-gaps/. sources/amb/kmz_stop_gaps/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/amb/kmz_stop_gaps/
          if ! git diff --cached --quiet; then
            git commit -m "data: audit KMZ SIU stop coverage and nearby unverified stop candidates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload full review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amb-kmz-route-stop-coverage-and-candidates
          path: build/amb-kmz-stop-gaps/
          if-no-files-found: warn
          retention-days: 45
