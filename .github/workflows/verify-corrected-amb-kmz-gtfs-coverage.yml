name: Verify corrected AMBQ KMZ coverage for GTFS shapes
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2,<3' 'beautifulsoup4>=4,<5'
      - name: Harvest current official AMBQ KMZ with four existing overrides
        run: python scripts/harvest_amb_kmz_routes.py --output sources/amb/kmz
      - name: Audit all GTFS route IDs against current KMZ manifest
        run: |
          python scripts/audit_current_amb_kmz_gtfs_coverage.py
          cat build/amb-current-kmz-shape-coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve coverage, actual downloaded KMZ and GeoJSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: current-AMBQ-KMZ-GTFS-coverage
          path: |
            build/amb-current-kmz-shape-coverage/
            sources/amb/kmz/manifest.csv
            sources/amb/kmz/summary.json
            sources/amb/kmz/geojson/
          if-no-files-found: warn
