name: Consolidate AMB GTFS sources

'on':
  workflow_dispatch:
  push:
    paths:
      - scripts/consolidate_amb_gtfs_sources.py
      - scripts/consolidate_amb_operator_sources.py
      - sources/amb/kmz_stop_gaps/kmz_siu_route_stop_coverage.csv
      - sources/siu/open_route_review/siu_amb_crosswalk_visual_decisions_2026-11-05.csv
      - sources/operators/coochofal/dispatch_windows.csv
      - sources/operators/transurbar/dispatch_windows.csv
      - scripts/select_amb_gtfs_first_seven.py
      - scripts/build_full_siu_gtfs_crosswalk.py
      - scripts/audit_siu_route_names_and_families.py
      - scripts/validate_siu_family_stops_against_shapes.py
      - sources/siu/public_extract/siu_itineraries.csv
      - sources/siu/gtfs_staging/candidate_route_stop_orders_NO_TIMES.csv
      - gtfs/routes.txt
      - sources/amb/gtfs_staging/route_headway_candidates.csv
      - sources/siu/gtfs_staging/siu_amb_route_crosswalk_review.csv
      - sources/amb/KMZ_first_GH_fallback_validation/source_shape_source_by_pattern.csv
      - sources/amb/research_closure_and_gtfs_handoff_2026-11-04.csv

permissions:
  contents: read

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and consolidate existing sources
        run: |
          python -m py_compile scripts/consolidate_amb_gtfs_sources.py
          python scripts/consolidate_amb_gtfs_sources.py --out build/gtfs-source-consolidation
      - name: Consolidate geometry, SIU stop coverage and operator dispatch windows
        run: python scripts/consolidate_amb_operator_sources.py
      - name: Select first seven GTFS patterns for review
        run: python scripts/select_amb_gtfs_first_seven.py --input build/gtfs-source-consolidation/route_source_consolidation.csv --out build/gtfs-source-consolidation
      - name: Publish shortlist summary
        run: cat build/gtfs-source-consolidation/first_seven_summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Build complete SIU to GTFS candidate crosswalk
        run: |
          python scripts/build_full_siu_gtfs_crosswalk.py --out build/siu-gtfs-crosswalk
          cat build/siu-gtfs-crosswalk/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload complete SIU crosswalk
        uses: actions/upload-artifact@v4
        with:
          name: SIU-GTFS-full-crosswalk-QA
          path: build/siu-gtfs-crosswalk/
          if-no-files-found: error
      - name: Audit SIU route names and base UUID families
        run: python scripts/audit_siu_route_names_and_families.py --out build/siu-gtfs-name-audit
      - name: Upload SIU name and family audit
        uses: actions/upload-artifact@v4
        with:
          name: SIU-route-names-and-families-QA
          path: build/siu-gtfs-name-audit/
          if-no-files-found: error
      - name: Validate SIU family stops against available geometry proxy
        run: python scripts/validate_siu_family_stops_against_shapes.py --out build/siu-family-shape-validation
      - name: Upload SIU family stop-to-shape spatial QA
        uses: actions/upload-artifact@v4
        with:
          name: SIU-family-stop-to-shape-QA
          path: build/siu-family-shape-validation/
          if-no-files-found: error
      - name: Upload route source consolidation and summary
        uses: actions/upload-artifact@v4
        with:
          name: AMB-GTFS-source-consolidation-QA
          path: build/gtfs-source-consolidation/
          if-no-files-found: error
