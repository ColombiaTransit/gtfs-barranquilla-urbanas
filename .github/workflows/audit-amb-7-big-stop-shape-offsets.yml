name: Investigate seven worst AMB stop-shape warnings against official KMZ
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/investigate_amb_seven_largest_stop_shape_offsets.py
      - .github/workflows/audit-amb-7-big-stop-shape-offsets.yml
permissions:
  contents: write
concurrency:
  group: amb-seven-largest-GH-shape-offsets-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review-seven:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install source geometry and GH bus client libraries
        run: python -m pip install --disable-pip-version-check requests "shapely>=2.0,<3" "pyproj>=3.5,<4"
      - name: Validate seven worst-stop research compiles
        run: python -m py_compile scripts/investigate_amb_seven_largest_stop_shape_offsets.py
      - name: Prepare historical ArcGIS fallback only where current AMB KMZ is inadequate
        run: python scripts/harvest_amb_arcgis_route_shapes.py build/amb-arcgis-fallback
      - name: Download official MobilityData Validator 8.0.1 with known checksum
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar \
            -o /tmp/gtfs-validator-8.0.1-cli.jar
          echo "19293ddd9b6f954f216d4f12054bd8a3232921751c4484339e339764a91000e2  /tmp/gtfs-validator-8.0.1-cli.jar" | sha256sum -c -
      - name: Examine 7 worst offsets, test multiple KMZ-constrained GH bus alternatives against REAL MobilityData
        env:
          GRAPHHOPPER_URL: ${{ vars.GRAPHHOPPER_URL }}
        run: |
          if [ -z "$GRAPHHOPPER_URL" ]; then
            echo "::error::Private GraphHopper organization endpoint missing"
            exit 1
          fi
          echo "::add-mask::$GRAPHHOPPER_URL"
          python scripts/investigate_amb_seven_largest_stop_shape_offsets.py \
            --jar /tmp/gtfs-validator-8.0.1-cli.jar \
            --max-trials 14
      - name: Display seven-case source and routing outcome
        if: always()
        run: |
          if [ -f build/amb-seven-P1-GH-shape-investigation/summary.md ]; then
            cat build/amb-seven-P1-GH-shape-investigation/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit seven-case QA and validator-safe road candidate only
        if: github.ref == 'refs/heads/main'
        run: |
          test -f build/amb-seven-P1-GH-shape-investigation/summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p sources/amb/GTFS_7_largest_shape_offset_review/
            cp -a build/amb-seven-P1-GH-shape-investigation/. sources/amb/GTFS_7_largest_shape_offset_review/
            git add sources/amb/GTFS_7_largest_shape_offset_review/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: investigate seven worst 2026 KMZ-to-GH bus stop offsets, preserve stop order"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Archive seven-stop evidence and candidate GH shapes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMB-seven-worst-stop-shape-source-and-validator-QA
          path: build/amb-seven-P1-GH-shape-investigation/
          if-no-files-found: warn
          retention-days: 60
