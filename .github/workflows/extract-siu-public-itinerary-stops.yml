name: Extract public SIU itinerary stops and coordinates
on:
  push:
    paths:
      - scripts/extract_siu_public_itinerary_stops.py
      - .github/workflows/extract-siu-public-itinerary-stops.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install anonymous Chromium browser
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Extract current public SIU itineraries with GPS stops
        run: python scripts/extract_siu_public_itinerary_stops.py
      - name: Show research result
        run: cat build/siu-gtfs-stops/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit derived research CSVs (not GTFS feed)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p sources/siu/public_extract
          cp build/siu-gtfs-stops/* sources/siu/public_extract/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/siu/public_extract/
          if ! git diff --cached --quiet; then
            git commit -m "data(siu): update public SIU itinerary stop UUID/GPS sequences"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Archive stop source tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siu-public-itinerary-stop-tables
          path: build/siu-gtfs-stops/
          if-no-files-found: warn
          retention-days: 45
