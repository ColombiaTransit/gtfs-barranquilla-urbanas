name: Audit SIU dis distance semantics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_siu_dis_distance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siu-dis-distance-audit
          path: sources/siu/dis_distance_audit/
