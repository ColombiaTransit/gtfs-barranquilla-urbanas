name: Inspect AMB Ninja Tables AJAX
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-ajax:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Capture AMB Ninja Tables AJAX responses
        run: python scripts/capture_amb_ajax.py
      - name: Upload HTML, raw AJAX and JSON diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amb-ninja-tables-ajax-2020-2026
          path: data/amb_ajax_diagnostic/
          retention-days: 7
          if-no-files-found: warn
