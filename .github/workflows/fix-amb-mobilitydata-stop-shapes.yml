name: Fix GTFS pilot stop-shape warnings using GH bus and rerun MobilityData
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/retry_amb_mobilitydata_stop_shape_warnings.py
      - scripts/compare_amb_gtfs_geometry_validator_reports.py
      - .github/workflows/fix-amb-mobilitydata-stop-shapes.yml
permissions:
  contents: write
concurrency:
  group: amb-GTFS-validator-targeted-shapes-${{ github.ref }}
  cancel-in-progress: false
jobs:
  route-and-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install GraphHopper and GIS dependencies
        run: python -m pip install --disable-pip-version-check requests "shapely>=2.0,<3" "pyproj>=3.5,<4"
      - name: Verify Python scripts compile
        run: |
          python -m py_compile scripts/build_amb_gtfs_geometry_validation_pilot.py \
            scripts/retry_amb_mobilitydata_stop_shape_warnings.py \
            scripts/compare_amb_gtfs_geometry_validator_reports.py
      - name: Download official MobilityData validator 8.0.1 and verify known SHA-256
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar \
            -o /tmp/gtfs-validator-8.0.1-cli.jar
          echo "19293ddd9b6f954f216d4f12054bd8a3232921751c4484339e339764a91000e2  /tmp/gtfs-validator-8.0.1-cli.jar" | sha256sum -c -
      - name: Build baseline NON-PUBLISHABLE research GTFS and run real MobilityData
        run: |
          python scripts/build_amb_gtfs_geometry_validation_pilot.py
          java -Xmx4g -jar /tmp/gtfs-validator-8.0.1-cli.jar \
            -i build/amb-gtfs-mobilitydata-PILOT-NOT-PUBLISHABLE/barranquilla_geometry_ONLY_TEST_NOT_FOR_PUBLICATION.zip \
            -o build/amb-gtfs-mobilitydata-PILOT-NOT-PUBLISHABLE/validator \
            -c co -t 2 \
            > build/amb-gtfs-mobilitydata-PILOT-NOT-PUBLISHABLE/validator_stdout.log 2>&1
          test -s build/amb-gtfs-mobilitydata-PILOT-NOT-PUBLISHABLE/validator/report.json
      - name: Load fallback source ArcGIS shapes for exact affected KMZ components
        run: python scripts/harvest_amb_arcgis_route_shapes.py build/amb-arcgis-fallback
      - name: Retry only actual validator flagged bus stop-shape road sections
        env:
          GRAPHHOPPER_URL: ${{ vars.GRAPHHOPPER_URL }}
        run: |
          if [ -z "$GRAPHHOPPER_URL" ]; then
            echo "::error::Private ColombiaTransit GRAPHHOPPER_URL organization variable missing"
            exit 1
          fi
          echo "::add-mask::$GRAPHHOPPER_URL"
          python scripts/retry_amb_mobilitydata_stop_shape_warnings.py \
            --max-affected-sections 300 --spacing-m 240
      - name: Generate NEW GTFS geometry research fixture from accepted GH sections
        run: |
          python scripts/build_amb_gtfs_geometry_validation_pilot.py \
            --road-dir build/amb-gtfs-geometry-stop-aware-retry \
            --out build/amb-gtfs-mobilitydata-STOP-AWARE-NOT-PUBLISHABLE
      - name: Run official MobilityData validator against regenerated STOP-AWARE demo
        run: |
          java -Xmx4g -jar /tmp/gtfs-validator-8.0.1-cli.jar \
            -i build/amb-gtfs-mobilitydata-STOP-AWARE-NOT-PUBLISHABLE/barranquilla_geometry_ONLY_TEST_NOT_FOR_PUBLICATION.zip \
            -o build/amb-gtfs-mobilitydata-STOP-AWARE-NOT-PUBLISHABLE/validator \
            -c co -t 2 \
            > build/amb-gtfs-mobilitydata-STOP-AWARE-NOT-PUBLISHABLE/validator_stdout.log 2>&1
          test -s build/amb-gtfs-mobilitydata-STOP-AWARE-NOT-PUBLISHABLE/validator/report.json
      - name: Compare actual MobilityData notices and identify remaining stop/order cases
        run: python scripts/compare_amb_gtfs_geometry_validator_reports.py
      - name: Write geographic QA summary to GitHub Action
        if: always()
        run: |
          if [ -f build/amb-GTFS-MobilityData-geography-comparison/summary.md ]; then
            cat build/amb-GTFS-MobilityData-geography-comparison/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Persist research result, not synthetic GTFS or unverified stop changes
        if: github.ref == 'refs/heads/main'
        run: |
          test -s build/amb-GTFS-MobilityData-geography-comparison/summary.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p sources/amb/GTFS_shape_validator_recheck/
            cp -a build/amb-GTFS-MobilityData-geography-comparison/. sources/amb/GTFS_shape_validator_recheck/
            cp build/amb-gtfs-geometry-stop-aware-retry/summary.json sources/amb/GTFS_shape_validator_recheck/targeted_GH_retry_summary.json
            cp build/amb-gtfs-geometry-stop-aware-retry/section_targeted_GH_bus_retry_review.csv sources/amb/GTFS_shape_validator_recheck/
            cp build/amb-gtfs-geometry-stop-aware-retry/MobilityData_249_stop_shape_issues_before_after.csv sources/amb/GTFS_shape_validator_recheck/
            cp build/amb-gtfs-geometry-stop-aware-retry/MobilityData_4_source_stop_order_warnings_REVIEW_ONLY.csv sources/amb/GTFS_shape_validator_recheck/
            cp build/amb-gtfs-geometry-stop-aware-retry/GraphHopper_bus_road_shapes_RESEARCH_ONLY.geojson sources/amb/GTFS_shape_validator_recheck/
            git add sources/amb/GTFS_shape_validator_recheck/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: compare real MobilityData notices after safer bus road geometry repair"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Archive both complete non-publishable feeds and both validator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMB-two-GTFS-validation-pilots-GH-geometry-BEFORE-AFTER
          path: |
            build/amb-GTFS-MobilityData-geography-comparison/
            build/amb-gtfs-geometry-stop-aware-retry/
            build/amb-gtfs-mobilitydata-PILOT-NOT-PUBLISHABLE/
            build/amb-gtfs-mobilitydata-STOP-AWARE-NOT-PUBLISHABLE/
          if-no-files-found: warn
          retention-days: 60
