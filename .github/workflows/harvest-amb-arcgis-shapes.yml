name: Harvest Barranquilla ArcGIS route shape candidates
on:
  push:
    paths:
      - scripts/harvest_amb_arcgis_route_shapes.py
      - .github/workflows/harvest-amb-arcgis-shapes.yml
      - gtfs/routes.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harvest-shapes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Harvest open GIS routes and propose route-code matches
        run: python scripts/harvest_amb_arcgis_route_shapes.py build/amb-arcgis-shapes
      - name: Report source coverage
        run: cat build/amb-arcgis-shapes/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit small geometry research index (not GTFS shapes.txt)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p sources/amb/arcgis_shape_staging
          cp build/amb-arcgis-shapes/route_shape_matches.csv sources/amb/arcgis_shape_staging/
          cp build/amb-arcgis-shapes/arcgis_feature_inventory.csv sources/amb/arcgis_shape_staging/
          cp build/amb-arcgis-shapes/summary.json sources/amb/arcgis_shape_staging/
          cp build/amb-arcgis-shapes/summary.md sources/amb/arcgis_shape_staging/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/amb/arcgis_shape_staging/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh 2023 ArcGIS candidate routes and coverage audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload source geojson and shape match reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amb-arcgis-route-shape-candidates
          path: build/amb-arcgis-shapes/
          if-no-files-found: warn
          retention-days: 45
