name: Reconstruct missing Barranquilla route-stop evidence (SOBUSA first)
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/review_sobusa_kmz_patterns.py
      - scripts/review_siu_kmz_variant_crosswalk.py
      - scripts/audit_sobusa_kmz_legal_lengths.py
      - scripts/build_missing_siu_route_workqueue.py
      - .github/workflows/review-missing-siu-stops-with-kmz.yml
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spatial analysis dependencies
        run: python -m pip install --disable-pip-version-check "shapely>=2.0,<3" "pyproj>=3.5,<4"
      - name: Check scripts
        run: python -m py_compile scripts/review_sobusa_kmz_patterns.py scripts/review_siu_kmz_variant_crosswalk.py scripts/build_missing_siu_route_workqueue.py scripts/audit_sobusa_kmz_legal_lengths.py
      - name: Build prioritized 60-record missing-SIU queue
        run: python scripts/build_missing_siu_route_workqueue.py
      - name: Project candidate locations onto SOBUSA A/B and measure small deviations
        run: python scripts/review_sobusa_kmz_patterns.py
      - name: Flag SOBUSA legal A/B length mismatches against KMZ
        run: python scripts/audit_sobusa_kmz_legal_lengths.py
      - name: Compare existing SIU ordered stop sequences against AMB KMZ candidates
        run: python scripts/review_siu_kmz_variant_crosswalk.py
      - name: Display source-bound findings
        if: always()
        run: |
          for file in build/amb-stops-priority-queue/summary.md build/amb-sobusa-pattern-review/summary.md build/amb-sobusa-pattern-review/legal_length_QA.md build/amb-siu-kmz-crosswalk/summary.md; do
            if [ -f "$file" ]; then cat "$file" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - name: Save research staging only (never live GTFS files)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p sources/amb/kmz_stop_research/workqueue sources/amb/kmz_stop_research/sobusa sources/amb/kmz_stop_research/siu_crosswalk
          cp build/amb-stops-priority-queue/* sources/amb/kmz_stop_research/workqueue/
          cp build/amb-sobusa-pattern-review/* sources/amb/kmz_stop_research/sobusa/
          cp build/amb-siu-kmz-crosswalk/* sources/amb/kmz_stop_research/siu_crosswalk/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/amb/kmz_stop_research/
          if ! git diff --cached --quiet; then
            git commit -m "data: stage missing SIU stop workqueue, SOBUSA A-B KMZ analysis and SIU crosswalk"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Archive research staging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmz-route-stop-research-workqueue-sobusa-crosswalk
          path: |
            build/amb-stops-priority-queue/
            build/amb-sobusa-pattern-review/
            build/amb-siu-kmz-crosswalk/
          if-no-files-found: warn
          retention-days: 45
