name: Build GTFS v2 with Flex and GTFS-RT contract
'on':
  workflow_dispatch:
    inputs:
      publish:
        description: Attempt publication gate (default research only)
        required: false
        default: 'false'
        type: boolean
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2,<3' 'beautifulsoup4>=4,<5' 'holidays>=0.60,<1'
      - name: Verify all Python scripts before expensive harvest
        run: python -m compileall -q scripts
      - name: Refresh official KMZ manifest with corrected URLs
        run: python scripts/harvest_amb_kmz_routes.py --output sources/amb/kmz
      - name: Regenerate frequency staging from latest dispatch assumptions
        run: python scripts/build_gtfs_frequency_staging.py --out build/gtfs-frequency-staging
      - name: Build GTFS v2 research output and realtime static contract
        run: python scripts/build_gtfs_v2.py ${{ inputs.publish == 'true' && '--publish' || '' }}
      - name: Build canonical route service register (only GTFS schedule input)
        run: python scripts/consolidate_gtfs_frequencies.py
      - name: Build first-version SIU GTFS with private GraphHopper
        env:
          GRAPHHOPPER_URL: ${{ vars.GRAPHHOPPER_URL }}
          GRAPHHOPPER_PROFILE: bus
        run: python scripts/build_gtfs_first_version.py
      - name: Validate generated GTFS with MobilityData GTFS Validator
        if: success()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, urllib.request
          api = "https://api.github.com/repos/MobilityData/gtfs-validator/releases/latest"
          request = urllib.request.Request(api, headers={"Accept": "application/vnd.github+json", "User-Agent": "gtfs-barranquilla-urbanas"})
          with urllib.request.urlopen(request, timeout=30) as response:
              release = json.load(response)
          assets = [a for a in release["assets"] if a["name"].endswith("-cli.jar") and "validator" in a["name"].lower()]
          if len(assets) != 1:
              raise RuntimeError(f"Expected one validator JAR, found {[a['name'] for a in assets]}")
          url = assets[0]["browser_download_url"]
          pathlib.Path("build/gtfs-validator.jar").parent.mkdir(parents=True, exist_ok=True)
          urllib.request.urlretrieve(url, "build/gtfs-validator.jar")
          print("MobilityData GTFS Validator release:", release["tag_name"])
          PY
          mkdir -p build/gtfs-v2/validator-report
          java -jar build/gtfs-validator.jar -i build/gtfs-v2/gtfs-first-version.zip -o build/gtfs-v2/validator-report
      - name: Summarize validator results
        if: always()
        run: |
          if test -d build/gtfs-v2/validator-report; then
            echo '### MobilityData GTFS Validator' >> "$GITHUB_STEP_SUMMARY"
            find build/gtfs-v2/validator-report -maxdepth 2 -type f -printf '%P\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Show summary
        if: always()
        run: |
          if test -f build/gtfs-v2/summary.json; then cat build/gtfs-v2/summary.json >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload generated QA, Flex and realtime contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtfs-v2-flex-rt-contract
          path: |
            build/gtfs-v2/
            build/gtfs-frequency-staging/
            build/registries/
          if-no-files-found: warn
