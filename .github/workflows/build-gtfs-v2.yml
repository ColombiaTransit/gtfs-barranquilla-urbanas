name: Build GTFS v2 with Flex and GTFS-RT contract
'on':
  workflow_dispatch:
    inputs:
      publish:
        description: Attempt publication gate (default research only)
        required: false
        default: 'false'
        type: boolean
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2,<3' 'beautifulsoup4>=4,<5' 'holidays>=0.60,<1'
      - name: Verify Python builder
        run: python -m py_compile scripts/build_gtfs_v2.py
      - name: Refresh official KMZ manifest with corrected URLs
        run: python scripts/harvest_amb_kmz_routes.py --output sources/amb/kmz
      - name: Build GTFS v2 research output and realtime static contract
        run: python scripts/build_gtfs_v2.py ${{ inputs.publish == 'true' && '--publish' || '' }}
      - name: Consolidate accepted route frequency sources
        run: python scripts/consolidate_gtfs_frequencies.py
      - name: Build first-version SIU GTFS with private GraphHopper
        env:
          GRAPHHOPPER_URL: ${{ vars.GRAPHHOPPER_URL }}
          GRAPHHOPPER_PROFILE: bus
        run: python scripts/build_gtfs_first_version.py
      - name: Show summary
        if: always()
        run: |
          if test -f build/gtfs-v2/summary.json; then cat build/gtfs-v2/summary.json >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload generated QA, Flex and realtime contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtfs-v2-flex-rt-contract
          path: build/gtfs-v2/
          if-no-files-found: warn
