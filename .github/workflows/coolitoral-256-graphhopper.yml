name: COOLITORAL 256 GraphHopper waypoint preparation
on:
  workflow_dispatch:
    inputs:
      route:
        description: "Route for optional GraphHopper routing"
        type: choice
        options: [PT4-4104-A, PT4-4104-B, PT5-4105-A, PT5-4105-B]
        default: PT4-4104-B
      route_approved:
        description: "I reviewed every candidate junction and its sequence (required for GraphHopper)"
        type: boolean
        default: false
jobs:
  candidates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Derive all legal A/B junction candidates from uploaded OSM JSON
        run: |
          python scripts/prepare_coolitoral_256_graphhopper.py \
            --overpass sources/osm/overpass/coolitoral_pt4_pt5_20261104.json
      - name: Inspect nearby OSM ways for unresolved transitions
        run: |
          python scripts/audit_coolitoral_256_gaps.py \
            --overpass sources/osm/overpass/coolitoral_pt4_pt5_20261104.json \
            --manifest sources/amb/kmz/coolitoral_256_graphhopper_waypoints.json
      - name: Publish unresolved street transitions in job summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("sources/amb/kmz/coolitoral_256_graphhopper_waypoints.json"))
          print("## Unresolved COOLITORAL street transitions")
          print("| From | To | Reason | Nearest distance (m) | Routes |")
          print("|---|---|---|---:|---|")
          for j in d["unresolved_unique_pairs"]:
              print(f"| {j['from']} | {j['to']} | {j['diagnosis']} | {j['distance_m']} | {', '.join(j['routes'])} |")
          print("\\nCandidates are not verified road-network connections.")
          PY
      - name: Optional GraphHopper candidate routing (reviewed only)
        if: ${{ inputs.route_approved }}
        env:
          GRAPHHOPPER_URL: ${{ vars.GRAPHHOPPER_URL }}
          ROUTE: ${{ inputs.route }}
        run: |
          python scripts/route_coolitoral_256_graphhopper.py \
            --manifest sources/amb/kmz/coolitoral_256_graphhopper_waypoints.json \
            --route "$ROUTE" --approved
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coolitoral-256-waypoint-candidates
          path: |
            sources/amb/kmz/coolitoral_256_graphhopper_waypoints.json
            sources/amb/kmz/coolitoral_256_gap_audit.json
            sources/amb/kmz/graphhopper_candidates/*.geojson
