name: COOLITORAL PT4 PT5 OSM overlay
on:
  workflow_dispatch:
    inputs:
      overpass_file:
        description: "Path to the uploaded Overpass Turbo JSON in this repository"
        required: true
        default: "sources/osm/overpass/coolitoral_pt4_pt5_20261104.json"
        type: string
jobs:
  overlay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate uploaded Overpass JSON
        env:
          OVERPASS_FILE: ${{ inputs.overpass_file }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          path=pathlib.Path(os.environ["OVERPASS_FILE"])
          if path.is_absolute() or ".." in path.parts:
              raise SystemExit("Overpass path must be inside the repository")
          if not path.is_file():
              raise SystemExit(f"Upload the Overpass Turbo JSON to {path} before running the workflow")
          obj=json.loads(path.read_text())
          ways=[e for e in obj.get("elements",[]) if e.get("type")=="way" and len(e.get("geometry",[]))>1]
          if not ways: raise SystemExit("Expected Overpass JSON with elements[].geometry")
          print(f"Loaded {len(ways)} OSM ways from {path}")
          PY
      - name: Overlay both KMZ routes with uploaded OSM streets
        env:
          OVERPASS_FILE: ${{ inputs.overpass_file }}
        run: python scripts/overlay_coolitoral_256_osm.py --overpass "$OVERPASS_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: coolitoral-pt4-pt5-osm-overlay
          path: sources/amb/kmz/coolitoral_256_osm_overlay.json
