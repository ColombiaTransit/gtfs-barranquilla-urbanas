name: Collect remaining AMB legal resolution PDFs and OCR
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/collect_amb_remaining_legal_ocr.py
      - .github/workflows/collect-amb-remaining-legal-ocr.yml
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF extraction and Spanish OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-spa ghostscript
          python -m pip install --disable-pip-version-check ocrmypdf
      - name: Validate script
        run: python -m py_compile scripts/collect_amb_remaining_legal_ocr.py
      - name: Download and OCR outstanding resolutions
        run: python scripts/collect_amb_remaining_legal_ocr.py
      - name: Fail if no original PDFs were recovered
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('build/amb-remaining-legal-ocr/summary.json').read_text())
          print(f"Recovered {summary['ocr_staged']} of {summary['total']} target PDFs")
          if summary['ocr_staged'] == 0:
              raise SystemExit("FAIL: no PDFs recovered; successful OCR/legal review cannot be claimed")
          PY
      - name: Report evidence completeness
        if: always()
        run: |
          if [ -f build/amb-remaining-legal-ocr/summary.json ]; then
            cat build/amb-remaining-legal-ocr/summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload source PDFs and OCR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amb-remaining-legal-pdfs-ocr-review-required
          path: build/amb-remaining-legal-ocr/
          retention-days: 7
          if-no-files-found: warn
