name: Stage existing SIU and OSM stop candidates for GraphHopper
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/stage_existing_osm_siu_gap_direction_candidates.py
      - .github/workflows/stage-amb-gap-direction-candidates.yml
permissions:
  contents: write
concurrency:
  group: amb-gap-direction-${{ github.ref }}
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spatial dependencies
        run: python -m pip install --disable-pip-version-check "shapely>=2.0,<3" "pyproj>=3.5,<4"
      - name: Run syntax test
        run: python -m py_compile scripts/stage_existing_osm_siu_gap_direction_candidates.py
      - name: Reuse existing OSM data and all SIU stop direction candidates
        run: python scripts/stage_existing_osm_siu_gap_direction_candidates.py
      - name: Show coverage report
        if: always()
        run: |
          if [ -f build/amb-gap-direction-candidate-staging/summary.md ]; then
            cat build/amb-gap-direction-candidate-staging/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save non-GTFS research outputs to the repo
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p sources/amb/gap_direction_staging/
            cp -a build/amb-gap-direction-candidate-staging/. sources/amb/gap_direction_staging/
            git add sources/amb/gap_direction_staging/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: keep existing SIU and OSM gap stop candidates pending GraphHopper direction QA"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Preserve CSV and GeoJSON as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: existing-siu-osm-gap-direction-candidates
          path: build/amb-gap-direction-candidate-staging/
          if-no-files-found: warn
          retention-days: 7
