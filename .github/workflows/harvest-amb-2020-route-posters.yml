name: Extract historic AMB first/last departures (2020 posters)
on:
  push:
    paths:
      - scripts/harvest_amb_2020_route_posters.py
      - .github/workflows/harvest-amb-2020-route-posters.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and Spanish OCR tools
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      - name: Download AMB historic images and extract original dispatch tables
        run: python scripts/harvest_amb_2020_route_posters.py amb-2020-posters
      - name: Upload source posters, table crops and OCR texts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amb-2020-first-last-departures
          path: amb-2020-posters/
          if-no-files-found: warn
          retention-days: 45
