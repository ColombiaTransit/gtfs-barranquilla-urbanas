name: Extract AMB PDFs by company (batch)
on:
  workflow_dispatch:
    inputs:
      agency:
        description: "Optional company (empty = all)"
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      agencies: ${{ steps.select.outputs.agencies }}
    steps:
      - uses: actions/checkout@v4
      - name: Select agencies from manifest
        id: select
        env:
          SELECTED_AGENCY: ${{ inputs.agency }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json, os
          with open("sources/amb/pdf_manifest.csv", encoding="utf-8", newline="") as f:
              names = sorted({r["agency"] for r in csv.DictReader(f)})
          selected = os.environ["SELECTED_AGENCY"].strip().upper()
          if selected:
              if selected not in names:
                  raise SystemExit(f"Unknown agency: {selected}; choices: {', '.join(names)}")
              names = [selected]
          print("agencies=" + json.dumps(names))
          PY
  extract:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        agency: ${{ fromJSON(needs.prepare.outputs.agencies) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF and Spanish OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-spa
      - name: Extract company PDFs
        run: python3 scripts/extract_amb_pdfs.py --agency "${{ matrix.agency }}" --out ocr-output
      - name: Upload per-company artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amb-pdf-${{ matrix.agency }}
          path: ocr-output/
          if-no-files-found: warn
          retention-days: 7
