name: Extract AMB PDFs by company (batch)
on:
  workflow_dispatch:
    inputs:
      agency:
        description: "Optional company filter (empty = all 22 companies)"
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  extract:
    if: ${{ inputs.agency == '' || inputs.agency == matrix.agency }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        agency: [COOTRAB, TRANSMECAR, FLOTA_ROJA, TRANSDIAZ, EMBUSA, MONTERREY, LA_CAROLINA, COOTRANSPORCAR, COOCHOFAL, TRASALFA, COOLITORAL, COOTRANTICO, LOLAYA, COOTRANSCO, COOTRASOL, SOBUSA, TRANSOLEDAD, TRANSURBAR, SODETRANS, COOTRANSNORTE, TRASALIANCO, COOASOATLAN]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF extraction and Spanish OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-spa
      - name: Extract company resolutions
        run: python3 scripts/extract_amb_pdfs.py --agency "${{ matrix.agency }}" --out "ocr-output"
      - name: Upload per-company extraction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amb-pdf-${{ matrix.agency }}
          path: ocr-output/
          if-no-files-found: warn
          retention-days: 30
